[package]
name = "timetrial"
description = "Lap timing and office leaderboards for a shared sim-racing rig"
edition.workspace = true
version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
local-ip-address = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tt-core = { path = "../../crates/tt-core" }
tt-games = { path = "../../crates/tt-games" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi"] }
