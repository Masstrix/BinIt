# Pro-lap challenges: a real driver's lap to beat, locked to a track, layout and car (or car class).
# Edit, rebuild, ship. Research and sources: docs/real-world-benchmarks.md.
#
# You can add your own in pro_challenges.toml in the app's data folder, under pro-laps (same format; an id that is
# already here replaces it). It is read again every time the Pro laps page opens.
#
# Each challenge is a [[challenges]] table:
#   time      "6:49.328" (also "1:02:03.456", "49.3"), or { min = 6, sec = 49, ms = 328 }, or whole milliseconds.
#   game      "acevo", a list ["acevo", "ac"], or "any" (leaving it out also means any game).
#   track     a track name, or a list of them. * means anything ("Bathurst*"). The spellings the games use for a
#             track are listed in track_aliases.toml (also in the data folder), so a mod's folder name can count.
#   layout    "GP", or a list of the names the games use for it: ["GP", "day"]. * works here too. Leave it out (or "")
#             and any layout counts: only the track has to match.
#   car       one car by its catalogue name, OR class: any car of that catalogue class ("GT3"). Set one, not both.
#   about     a paragraph. Long text can be wrapped with a backslash at the end of each line (see below).
#   art       the picture's file name in app/public/challenge-art, with its extension ("monza.jpg").
#   artOffset / cardOffset: where to centre the picture when it is cropped, across then down: "60% 40%", [60, 40]
#             or { x = 60, y = 40 }. The tall card in the list shows a narrow slice of a wide picture, so cardOffset
#             matters most (it follows artOffset if not set).
#   enabled   false keeps a challenge in the file but switched off: not shown, can't be started, counts no laps.
#   margin    marginPercent and rewards below are the defaults. Give a challenge its own to change just that one;
#             rewards can set only proLevel or only beat.

marginPercent = 3.0

[rewards.proLevel]
xp = 1000
coins = 800

[rewards.beat]
xp = 3000
coins = 2000

[[challenges]]
id = "nord-992-gt3rs"
name = "Nordschleife"
game = ["acevo", "ac"]
track = "Nurburgring"
layout = "Nordschleife"
car = "Porsche 911 (992) GT3 RS"
time = "6:49.328"
driver = "Jörg Bergmeister"
date = "2022-10"
realCar = "Porsche 911 GT3 RS (992.1)"
session = "Record attempt, full 20.832 km lap"
confidence = "A"
source = "Notarised record attempt"
about = """\
In October 2022 Porsche took a standard 992 GT3 RS, the road car, round the full Nordschleife in 6:49.328 \
with Jörg Bergmeister driving. The run was timed and certified by a notary. \
A flying lap on warm tyres, so treat it as a target to approach.\
"""
art = "nordschleife-992-gt3-rs.jpg"
cardOffset = "53% 50%"

