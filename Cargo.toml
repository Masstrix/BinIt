[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
