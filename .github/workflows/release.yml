# Makes a new release of Bin It: Actions tab -> "Release" -> "Run workflow".
#
# Raises the version, runs the tests, builds and signs the installer and the portable exe, commits
# the new version to main with a tag (vX.Y.Z), and publishes a GitHub release with the files and
# the latest.json that installed copies check when they start. Nothing is committed or published
# unless the build and tests pass. See docs/building.md, "Releases and updates".
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise (0.2.0 -> patch 0.2.1, minor 0.3.0, major 1.0.0)
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version, e.g. 1.0.0 (leave empty to use the choice above)
        type: string
        required: false

permissions:
  contents: write

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # A fresh checkout has no build counter, so the build number is this workflow's run number.
      BINIT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the update-signing key is set
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't set (Settings > Secrets and variables > Actions). See docs/building.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and history, for the release notes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set the version
        id: version
        shell: bash
        env:
          WANTED: ${{ inputs.version || inputs.bump }}
        run: node scripts/set-version.mjs "$WANTED" | tee -a "$GITHUB_OUTPUT"

      - name: Install web dependencies
        working-directory: app
        run: npm ci

      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Gather the release files
        shell: bash
        run: node scripts/prepare-release.mjs "${{ steps.version.outputs.version }}" "${{ github.repository }}"

      - name: Commit and tag the new version
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$v"
          git tag "v$v"
          git push --atomic origin HEAD:main "v$v"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          cd release
          gh release create "v$v" --title "Bin It $v" --notes-file notes.md --latest \
            $(ls | grep -v '^notes\.md$')
